<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔靈召喚 帳號分析工具 — 九濤峰</title>
<style>
:root{--bg:#0f1220;--panel:#1a1f35;--panel2:#232a45;--line:#2f3860;--txt:#e6e9f5;--dim:#9aa3c7;--acc:#6ea8ff;--good:#37d67a;--warn:#ffb020;--bad:#ff5470;
--water:#3b9dff;--fire:#ff6b4a;--wind:#ffd23f;--light:#f2f2f2;--dark:#b06bff;}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{padding:14px 20px;background:linear-gradient(90deg,#1a1f35,#232a45);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .stat{color:var(--dim);font-size:12px}
header .stat b{color:var(--acc);font-size:14px}
nav{display:flex;gap:4px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{background:transparent;border:1px solid transparent;color:var(--dim);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
nav button:hover{background:var(--panel2);color:var(--txt)}
nav button.active{background:var(--acc);color:#08122b;font-weight:600}
main{padding:16px 20px;max-width:1500px;margin:0 auto}
.tab{display:none}.tab.active{display:block}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:7px;font-size:13px}
input::placeholder{color:var(--dim)}
label{color:var(--dim);font-size:12px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{background:var(--panel2);position:sticky;top:0;cursor:pointer;user-select:none;font-weight:600}
th:hover{color:var(--acc)}
tr:hover td{background:#1e2440}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600}
.water{background:rgba(59,157,255,.18);color:var(--water)}
.fire{background:rgba(255,107,74,.18);color:var(--fire)}
.wind{background:rgba(255,210,63,.18);color:var(--wind)}
.light{background:rgba(242,242,242,.14);color:#fff}
.dark{background:rgba(176,107,255,.18);color:var(--dark)}
.eff-hi{color:var(--good);font-weight:700}.eff-mid{color:var(--warn)}.eff-lo{color:var(--dim)}
.anc{color:#ffd23f;font-weight:700}
.muted{color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.dcard h3{margin:0 0 4px}
.dcard .sub{color:var(--dim);font-size:12px;margin-bottom:10px}
.team{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:10px;background:var(--panel2)}
.team .tl{font-weight:600;margin-bottom:6px;color:var(--acc)}
.unitrow{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed #2a3255;font-size:12.5px}
.unitrow:last-child{border-bottom:none}
.own{color:var(--good);font-weight:600}
.noown{color:var(--bad)}
.rl{color:var(--dim);font-size:11px}
.setbadge{background:#2a3255;color:#cbd3ff;padding:1px 6px;border-radius:5px;font-size:11px;margin-left:4px}
.big{font-size:22px;font-weight:700;color:var(--acc)}
.kv{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
.kv div span{color:var(--dim);font-size:12px;display:block}
.kv div b{font-size:16px}
.fitbox{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.fitbox{grid-template-columns:1fr}}
.slotline{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12.5px}
.slotline:hover{background:#1e2440}
.statsum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.statsum div{background:var(--panel2);border-radius:7px;padding:6px 8px;font-size:12px}
.statsum b{color:var(--acc)}
small.note{color:var(--dim);font-size:11px}
.btn{background:var(--acc);color:#08122b;border:none;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}
tr.clk{cursor:pointer}
/* 魔靈詳細彈窗 */
.overlay{position:fixed;inset:0;background:rgba(4,6,14,.72);display:none;z-index:100;overflow:auto;padding:36px 16px}
.overlay.open{display:block}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:960px;margin:0 auto;padding:20px 22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal .x{position:absolute;top:12px;right:14px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
.modal h2{margin:0 0 4px;font-size:20px}
.modal .msub{color:var(--dim);font-size:12.5px;margin-bottom:12px}
.mstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin:10px 0 4px}
.mstats div{background:var(--panel2);border-radius:7px;padding:6px 8px;font-size:12px}
.mstats div span{color:var(--dim);display:block;font-size:11px}
.mstats div b{font-size:14px}
.mgore{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:12px 0;font-size:12.5px}
.mgore b{color:var(--good)}
.runegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px;margin-top:8px}
.runebox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.runebox.empty{opacity:.5;text-align:center;color:var(--dim);display:flex;align-items:center;justify-content:center;min-height:120px}
.runebox .rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.runebox .slot{font-weight:700}
.runebox .main{font-size:15px;font-weight:700;margin:2px 0}
.runebox .pf{color:var(--dim);font-size:12px;margin-bottom:4px}
.subline{padding:2px 0;font-size:12.5px;border-top:1px dashed #2a3255}
.subline:first-of-type{border-top:none}
.mgore b{color:var(--good)}.mgore .gemtxt{color:var(--dark)}
.mgore>div{margin:2px 0}
.grind{background:rgba(55,214,122,.2);color:var(--good);padding:0 5px;border-radius:5px;font-weight:600;margin-left:4px}
.gem{background:rgba(176,107,255,.22);color:var(--dark);padding:0 5px;border-radius:5px;font-weight:600;margin-left:4px}
.qbadge{font-size:11px;padding:1px 6px;border-radius:5px;font-weight:600}
.q1{background:#3a4260;color:#cbd3ff}.q2{background:rgba(59,157,255,.2);color:var(--water)}
.q3{background:rgba(55,214,122,.2);color:var(--good)}.q4{background:rgba(255,176,32,.2);color:var(--warn)}
.q5{background:rgba(176,107,255,.22);color:var(--dark)}
/* 符文評級徽章 */
.gbadge{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;display:inline-block}
.gSSS{background:#ffcf33;color:#3a2a00}.gSS{background:#ff9f43;color:#231400}
.gS{background:#3b9dff;color:#fff}.gA{background:#37d67a;color:#062a15}
.gB{background:#5a6488;color:#fff}.gC{background:#3a4160;color:#9aa3c7}
.roll-hi{color:var(--good);font-weight:700}.roll-mid{color:var(--warn)}.roll-lo{color:var(--dim)}
/* 怪物圖鑑 */
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:10px}
.mon{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 6px 6px;text-align:center;position:relative}
.mon img{width:56px;height:56px;display:block;margin:0 auto 4px}
.mon .mn{font-size:11px;line-height:1.25;height:28px;overflow:hidden}
.mon .st{position:absolute;top:4px;left:6px;font-size:10px;color:var(--warn);font-weight:700}
.mon .el{position:absolute;top:5px;right:6px;width:9px;height:9px;border-radius:50%}
.mon .tier{position:absolute;top:4px;left:5px;font-size:11px;font-weight:800;padding:0 5px;border-radius:5px;line-height:16px}
.tS{background:#ffcf33;color:#3a2a00}.tA{background:#ff6b4a;color:#fff}.tB{background:#3b9dff;color:#fff}
.tC{background:#5a6488;color:#fff}.tD{background:#3a4160;color:#9aa3c7}
.mon .sub2{font-size:10px;color:var(--dim);margin-top:1px;line-height:1.2}
.mon .rta{color:var(--warn);font-weight:700}
.mon.no img{filter:grayscale(1) brightness(.72)}
.mon.no .mn{color:var(--dim)}
.mon.no{opacity:.82}
.el-water{background:var(--water)}.el-fire{background:var(--fire)}.el-wind{background:var(--wind)}.el-light{background:#e9e9f2}.el-dark{background:var(--dark)}
td.uic img{width:30px;height:30px;vertical-align:middle;border-radius:6px;margin-right:6px}
</style>
</head>
<body>
<header>
  <h1>⚔️ 魔靈召喚 帳號分析工具</h1>
  <span class="stat">玩家 <b>九濤峰</b></span>
  <span class="stat">怪物 <b id="hUnits">0</b></span>
  <span class="stat">符文 <b id="hRunes">0</b></span>
  <span class="stat">平均效率 <b id="hEff">0%</b></span>
  <span class="stat">90%+符文 <b id="hHi">0</b></span>
  <button class="btn" id="impBtn" style="margin-left:auto">📥 匯入新JSON</button>
  <input type="file" id="impFile" accept=".json,application/json" style="display:none">
  <span class="stat" id="impStatus"></span>
</header>
<nav>
  <button data-tab="units" class="active">魔靈庫</button>
  <button data-tab="dex">怪物圖鑑</button>
  <button data-tab="runes">符文庫</button>
  <button data-tab="dungeons">地下城隊伍</button>
  <button data-tab="fit">符文自動配裝</button>
  <button data-tab="overview">總覽</button>
</nav>
<main>
  <section id="units" class="tab active">
    <div class="controls">
      <input id="uSearch" placeholder="搜尋怪物名稱…" style="min-width:200px">
      <select id="uAttr"><option value="">全部屬性</option><option>水</option><option>火</option><option>風</option><option>光</option><option>暗</option></select>
      <select id="uStar"><option value="">全部星數</option><option value="6">6★</option><option value="5">5★</option><option value="4">4★</option><option value="3">≤3★</option></select>
      <select id="uArch"><option value="">全部職業</option><option>Attack</option><option>Support</option><option>HP</option><option>Defense</option></select>
      <select id="uNat"><option value="">全部天生</option><option value="5">天生5★</option><option value="4">天生4★</option><option value="3">天生3★</option><option value="2">天生2★</option></select>
      <span class="muted" id="uCount"></span>
    </div>
    <div class="tablewrap"><table id="uTable"></table></div>
  </section>

  <section id="dex" class="tab">
    <div class="controls">
      <input id="xSearch" placeholder="搜尋中英文名…" style="min-width:200px">
      <select id="xAttr"><option value="">全部屬性</option><option>水</option><option>火</option><option>風</option><option>光</option><option>暗</option></select>
      <select id="xArch"><option value="">全部職業</option><option value="Attack">攻擊</option><option value="Support">支援</option><option value="HP">體力</option><option value="Defense">防禦</option><option value="Material">素材</option></select>
      <select id="xNat"><option value="">全部天生</option><option value="5">天生5★</option><option value="4">天生4★</option><option value="3">天生3★</option><option value="2">天生2★</option><option value="1">天生1★</option></select>
      <select id="xAwk"><option value="">覺醒/未覺醒</option><option value="1">已覺醒</option><option value="0">未覺醒</option><option value="2">二次覺醒</option></select>
      <select id="xTier"><option value="">全部強度</option><option>S</option><option>A</option><option>B</option><option>C</option><option>D</option></select>
      <select id="xOwn"><option value="">全部</option><option value="1">只看已持有</option><option value="0">只看未持有</option></select>
      <label><input type="checkbox" id="xRta"> 只看當前版本RTA</label>
      <span class="muted" id="xCount"></span>
    </div>
    <div id="dexGrid" class="dexgrid"></div>
  </section>

  <section id="runes" class="tab">
    <div class="controls">
      <select id="rSet"><option value="">全部套裝</option></select>
      <select id="rSlot"><option value="">全部洞位</option><option value="1">1洞</option><option value="2">2洞</option><option value="3">3洞</option><option value="4">4洞</option><option value="5">5洞</option><option value="6">6洞</option></select>
      <select id="rMain"><option value="">全部主屬</option></select>
      <select id="rGrade"><option value="">全部評級</option><option>SSS</option><option>SS</option><option>S</option><option>A</option><option>B</option><option>C</option></select>
      <select id="rEq"><option value="">全部</option><option value="0">倉庫(未裝)</option><option value="1">已裝備</option></select>
      <select id="rAnc"><option value="">一般+上古</option><option value="1">僅上古</option></select>
      <label>效率≥<input id="rEff" type="number" value="0" min="0" max="130" style="width:64px"></label>
      <input id="rOwner" placeholder="裝在誰身上…" style="width:150px">
      <span class="muted" id="rCount"></span>
    </div>
    <div class="tablewrap"><table id="rTable"></table></div>
  </section>

  <section id="dungeons" class="tab">
    <div class="controls">
      <input id="dSearch" placeholder="搜尋地下城 / 怪物…" style="min-width:220px">
      <label><input type="checkbox" id="dOwnedOnly"> 只顯示我有的角色</label>
      <span class="muted">綠=已擁有　紅=缺少</span>
    </div>
    <div id="dungeonGrid" class="grid"></div>
  </section>

  <section id="fit" class="tab">
    <div class="card">
      <div class="controls">
        <label>怪物 <select id="fUnit" style="min-width:220px"></select></label>
        <label>4件套 <select id="fSet4"></select></label>
        <label>2件套 <select id="fSet2"></select></label>
        <label>2洞主屬 <select id="fS2"></select></label>
        <label>4洞主屬 <select id="fS4"></select></label>
        <label>6洞主屬 <select id="fS6"></select></label>
        <label><input type="checkbox" id="fPool"> 含裝在別隻的符文</label>
        <button class="btn" id="fRun">計算最佳配裝</button>
      </div>
      <small class="note">引擎會從「倉庫未裝 ＋ 這隻目前的符文」中挑選（勾選上面選項可納入全帳號符文）。列舉 2 件套要放哪兩洞的所有組合取效率最高解。</small>
    </div>
    <div class="fitbox">
      <div class="card"><h3 style="margin-top:0">推薦配裝</h3><div id="fResult"><span class="muted">選好條件後按「計算最佳配裝」</span></div></div>
      <div class="card"><h3 style="margin-top:0">符文加成合計</h3><div id="fStats"><span class="muted">—</span></div></div>
    </div>
  </section>

  <section id="overview" class="tab">
    <div class="grid" id="ovGrid"></div>
  </section>
</main>

<div class="overlay" id="uModal"><div class="modal"><button class="x" id="uModalX">✕</button><div id="uModalBody"></div></div></div>

<script>
let UNITS = /*UNITS_DATA*/[]/*END*/;
let RUNES = /*RUNES_DATA*/[]/*END*/;
const MONSTER_DB = /*MONSTER_DB*/{}/*END*/;
const ZH_NAMES = /*ZH_NAMES*/{}/*END*/;
const CATALOG = /*CATALOG*/[]/*END*/;   // 可召喚怪物圖鑑 [{mid,en,zh,at,ar,ns,aw,img}]
const ICONS = /*ICONS*/{}/*END*/;        // master_id -> icon 檔名
const LINKS = /*LINKS*/{}/*END*/;        // 持有等價：mid -> 群組代表(覺醒鏈/變身共用一格)
</script>
<script>

</script>
<script>

</script>
</body>
</html>
